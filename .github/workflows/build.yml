name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compilar
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: comp-jar
          path: build/libs/*.jar

      - name: Crear release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" build/libs/*.jar \
            --title "Build ${{ github.run_number }}" \
            --notes "Compilado automáticamente desde el commit ${{ github.sha }}" \
            --target ${{ github.sha }}
